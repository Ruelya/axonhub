# When enabled (default), Responses outbound may set prompt_cache_key from a
# stable client session/trace (Session-Id, AH-Trace-Id from client, etc.).
# AxonHub auto-generated at-<uuid> ids are never used. When disabled, never
# auto-inject; client-provided prompt_cache_key still passes through.
type AutoPromptCacheKeyFromSessionSettings {
  enabled: Boolean!
}

input UpdateAutoPromptCacheKeyFromSessionSettingsInput {
  enabled: Boolean!
}

# --- Client compatibility (coding agent detect + response wire patches) ---

type ClientUARule {
  id: String!
  pattern: String!
  profileId: String!
  priority: Int!
  enabled: Boolean!
  isRegex: Boolean!
}

type ClientDetectionConfig {
  explicitHeader: String!
  explicitVersionHeader: String!
  userAgentRules: [ClientUARule!]!
}

type ClientPatchConfig {
  ensureOutputTextAnnotations: Boolean!
}

type ClientProfileView {
  id: String!
  displayName: String!
  enabled: Boolean!
  templateId: String!
  patches: ClientPatchConfig!
}

type ClientTemplate {
  id: String!
  displayName: String!
  description: String!
  requiredPaths: [String!]!
  absentVsEmptyArrayPaths: [String!]!
  builtin: Boolean!
}

type ClientCompatView {
  enabled: Boolean!
  detection: ClientDetectionConfig!
  profiles: [ClientProfileView!]!
  templates: [ClientTemplate!]!
}

input UpdateClientUARuleInput {
  id: String!
  pattern: String!
  profileId: String!
  priority: Int!
  enabled: Boolean!
  isRegex: Boolean
}

input UpdateClientProfileInput {
  id: String!
  enabled: Boolean
  templateId: String
  ensureOutputTextAnnotations: Boolean
}

input UpdateClientCompatSettingsInput {
  enabled: Boolean
  explicitHeader: String
  explicitVersionHeader: String
