type RetryPolicy {
  maxChannelRetries: Int!
  maxSingleChannelRetries: Int!
  retryDelayMs: Int!
  streamFirstEventTimeoutSeconds: Int!
  nonStreamResponseTimeoutSeconds: Int!
  """SSE comment keepalives while waiting on upstream / between events (0 disables). Helps Cloudflare ~100s idle."""
  sseKeepAliveIntervalSeconds: Int!
  loadBalancerStrategy: String!
  traceStickyMode: TraceStickyMode!
  enabled: Boolean!
  autoDisableChannel: AutoDisableChannel!
  emptyResponseDetection: Boolean!
  upstreamErrorPolicy: UpstreamErrorPolicy!
}

type UpstreamErrorPolicy {
  mode: String!
  customMessage: String!
}

input UpstreamErrorPolicyInput {
  mode: String
  customMessage: String
}

